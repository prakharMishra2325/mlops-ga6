name: Build and push to Artifact Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPOSITORY: ga6-repo
  IMAGE: iris-ga6

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t iris-ga6 .

      - name: Tag Docker image in the repo
        run: docker tag iris-ga6 ${{ env.REGION }}-docker.pkg.dev/iitm-mlops-project/ga6-repo/iris-ga6:latest

      - name: Push image
        run: docker push ${{ env.REGION }}-docker.pkg.dev/iitm-mlops-project/ga6-repo/iris-ga6:latest

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: demo-gke-iris-cluster
          location: us-central1

      - name: Deploy to GKE
        run: kubectl apply -f k8s/deployment.yaml

      - name: Restart deployment to pick up the new image
        run: kubectl rollout restart deployment/iris-ga6

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/iris-ga6 --timeout=180s
          kubectl get service iris-ga6
