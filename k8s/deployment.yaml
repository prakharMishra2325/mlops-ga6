apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-ga6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris-ga6
  template:
    metadata:
      labels:
        app: iris-ga6
    spec:
      containers:
        - name: iris-ga6
          image: us-central1-docker.pkg.dev/iitm-mlops-project/ga6-repo/iris-ga6:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8200
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: iris-ga6
spec:
  type: LoadBalancer
  selector:
    app: iris-ga6
  ports:
    - port: 80
      targetPort: 8200
